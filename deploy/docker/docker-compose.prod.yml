# ExtractIQ API on a single VPS (e.g. Hostinger KVM 2) with Docker. The web app runs on Vercel.
#
#   cp api/.env.example deploy/docker/api.env      # fill in: APP_KEY, DB_PASSWORD, domains, keys…
#   DOMAIN=example.com docker compose -f deploy/docker/docker-compose.prod.yml up -d --build
#   docker compose -f deploy/docker/docker-compose.prod.yml exec api php artisan migrate --force
#
# Caddy terminates TLS (Let's Encrypt) for api.$DOMAIN and ws.$DOMAIN. Postgres and Redis are not
# published to the host. Documents go to S3 (DOCUMENTS_DISK=s3) so the containers stay stateless.
x-api: &api
  build: { context: ../../api, dockerfile: ../deploy/docker/api.Dockerfile }
  image: extractiq-api:latest
  env_file: ./api.env
  environment:
    DB_HOST: postgres
    REDIS_HOST: redis
  depends_on:
    postgres: { condition: service_healthy }
    redis: { condition: service_healthy }
  restart: unless-stopped

services:
  caddy:
    image: caddy:2.8-alpine
    ports: ["80:80", "443:443", "443:443/udp"]
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN, e.g. example.com}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on: [api, reverb]
    restart: unless-stopped

  api:
    <<: *api

  horizon:
    <<: *api
    command: php artisan horizon
    healthcheck: { test: ["CMD", "php", "artisan", "horizon:status"], interval: 60s, timeout: 10s, retries: 3 }

  scheduler:
    <<: *api
    command: php artisan schedule:work
    healthcheck: { disable: true }

  reverb:
    <<: *api
    command: php artisan reverb:start --host=0.0.0.0 --port=8031
    healthcheck: { disable: true }

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: extractiq
      POSTGRES_USER: extractiq
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD (same as in api.env)}
    volumes: [pg-data:/var/lib/postgresql/data]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U extractiq"], interval: 10s, timeout: 5s, retries: 5 }
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes: [redis-data:/data]
    healthcheck: { test: ["CMD", "redis-cli", "ping"], interval: 10s, timeout: 5s, retries: 5 }
    restart: unless-stopped

volumes:
  pg-data:
  redis-data:
  caddy-data:
  caddy-config:
