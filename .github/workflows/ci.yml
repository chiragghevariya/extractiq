name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API (Pest + Larastan)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: System packages (poppler, tesseract)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends poppler-utils tesseract-ocr tesseract-ocr-deu
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm, cache-dependency-path: samples/package-lock.json }
      - name: Sample documents
        run: cd samples && npm ci && npm run generate
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: pdo_pgsql, pdo_sqlite, intl, zip, bcmath, pcntl
          coverage: none
      - uses: actions/cache@v4
        with:
          path: api/vendor
          key: composer-${{ hashFiles('api/composer.lock') }}
      - name: Composer install
        run: cd api && composer install --no-interaction --prefer-dist
      - name: Environment
        run: cd api && cp .env.example .env && php artisan key:generate
      - name: Pest
        run: cd api && vendor/bin/pest --parallel
      - name: Larastan
        run: cd api && vendor/bin/phpstan analyse --memory-limit=1G --no-progress

  web:
    name: Web (types + ESLint + build)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm, cache-dependency-path: web/package-lock.json }
      - run: cd web && npm ci
      - run: cd web && npm run typecheck
      - run: cd web && npm run lint
      - run: cd web && npm run build
        env: { NEXT_PUBLIC_API_URL: "http://localhost:8030/api/v1" }

  e2e:
    name: Playwright (full stack)
    needs: [api, web]
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_DB: extractiq, POSTGRES_USER: extractiq, POSTGRES_PASSWORD: extractiq }
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U extractiq" --health-interval 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-retries 10
      mailpit:
        image: axllent/mailpit:v1.24
        ports: ["1025:1025", "8025:8025"]
    env:
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_DATABASE: extractiq
      DB_USERNAME: extractiq
      DB_PASSWORD: extractiq
      DOCUMENTS_DISK: local
      QUEUE_CONNECTION: redis
      BROADCAST_CONNECTION: "null"
      MAIL_MAILER: smtp
      MAIL_PORT: 1025
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends poppler-utils tesseract-ocr tesseract-ocr-deu
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: cd samples && npm ci && npm run generate
      - uses: shivammathur/setup-php@v2
        with: { php-version: "8.3", extensions: "pdo_pgsql, intl, zip, bcmath, pcntl", coverage: none }
      - run: cd api && composer install --no-interaction --prefer-dist && cp .env.example .env && php artisan key:generate
      - name: Seed (runs the samples through the real pipeline)
        run: cd api && php artisan migrate:fresh --seed --force
      - name: Start API, queue worker and scheduler
        run: |
          cd api
          nohup php artisan serve --port=8030 --no-reload > ../api.log 2>&1 &
          nohup php artisan horizon > ../horizon.log 2>&1 &
          nohup php artisan schedule:work > ../schedule.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8030/api/health && break; sleep 2; done
      - name: Build and start web
        run: |
          cd web && npm ci && npm run build
          nohup npx next start -p 3030 > ../web.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS -o /dev/null http://localhost:3030/login && break; sleep 2; done
        env: { NEXT_PUBLIC_API_URL: "http://localhost:8030/api/v1" }
      - run: cd web && npx playwright install --with-deps chromium
      - run: cd web && npx playwright test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            web/test-results
            *.log
