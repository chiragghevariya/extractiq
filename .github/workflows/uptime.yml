name: Uptime

# Pings the production health endpoint every 15 minutes; a failing run is the alert (GitHub emails
# the repository owner). Set the repository variables HEALTH_URL (https://api.example.com/api/health)
# and WEB_URL (https://app.example.com). Without them the job is skipped.
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

jobs:
  check:
    if: vars.HEALTH_URL != ''
    runs-on: ubuntu-24.04
    steps:
      - name: API health
        run: |
          body=$(curl -fsS --max-time 15 --retry 2 --retry-delay 10 "${{ vars.HEALTH_URL }}")
          echo "$body"
          echo "$body" | jq -e '.status == "ok"' > /dev/null || { echo "::error::API is $(echo "$body" | jq -r .status)"; exit 1; }
      - name: Web app
        if: vars.WEB_URL != ''
        run: curl -fsS --max-time 15 --retry 2 -o /dev/null -w "%{http_code} in %{time_total}s\n" "${{ vars.WEB_URL }}"
